name: J2K stable signed update (trusted main only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-update:
    # Never expose signing material to pull_request code or arbitrary feature branches.
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out reviewed main source
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Provision owner-controlled stable update signing certificate
        shell: bash
        env:
          UPDATE_B64: ${{ secrets.JH_UPDATE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.JH_UPDATE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JH_UPDATE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.JH_UPDATE_KEY_PASSWORD }}
          EXPECTED_SHA: ${{ secrets.JH_UPDATE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for variable in UPDATE_B64 STORE_PASS KEY_ALIAS KEY_PASS EXPECTED_SHA; do
            test -n "${!variable:-}" || { echo "ERROR: missing required stable signing secret: $variable"; exit 1; }
          done
          umask 077
          printf '%s' "$UPDATE_B64" | base64 --decode > "$RUNNER_TEMP/jh-update-keystore.p12"
          test -s "$RUNNER_TEMP/jh-update-keystore.p12"
          {
            echo "JH_UPDATE_STORE_FILE=$RUNNER_TEMP/jh-update-keystore.p12"
            echo "JH_UPDATE_STORE_PASSWORD=$STORE_PASS"
            echo "JH_UPDATE_KEY_ALIAS=$KEY_ALIAS"
            echo "JH_UPDATE_KEY_PASSWORD=$KEY_PASS"
            echo "JH_UPDATE_CERT_SHA256=$EXPECTED_SHA"
          } >> "$GITHUB_ENV"
      - name: Run full Android tests and create only the signed arm64 APK
        run: ./gradlew -Pjh.arm64Only=true --no-daemon testDevDebugUnitTest verifySingleArm64DevApk
      - name: Assert app identity, upgrade version and pinned signer fingerprint
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/dev/debug/app-dev-arm64-v8a-debug.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/jh-cert.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/jh-cert.txt" | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(printf '%s' "$JH_UPDATE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL" && test "$ACTUAL" = "$EXPECTED" || { echo 'ERROR: APK signing key is not the pinned update certificate'; exit 1; }
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -E "package: name='eu\.kanade\.tachiyomi\.enhanced\.debugJ2K' versionCode='(11[4-9]|1[2-9][0-9]|[2-9][0-9][0-9]|[1-9][0-9]{3,})'"
          echo 'PASS: pinned certificate, unchanged app identity, higher versionCode'
          sha256sum "$APK"
      - name: Upload one verified, signed stable-update APK
        uses: actions/upload-artifact@v4
        with:
          name: app-dev-arm64-v8a-debug.apk
          path: app/build/outputs/apk/dev/debug/app-dev-arm64-v8a-debug.apk
          if-no-files-found: error
      - name: Clean up signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/jh-update-keystore.p12"
